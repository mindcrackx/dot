# Personal Omarchy overrides
# This file is sourced from hyprland.conf

# Monitor configuration - 1.6x scaling (160%)
env = GDK_SCALE,1.2
monitor=,preferred,auto,1.2

# Security: Prevent screen sharing of password manager
windowrule = noscreenshare, class:^(org.keepassxc.KeePassXC)$

# Override ChatGPT keybinding to open Claude.ai instead
unbind = SUPER SHIFT, A
bindd = SUPER SHIFT, A, Claude, exec, omarchy-launch-webapp "https://claude.ai"

# Override YouTube to use Firefox (for uBlock Origin support)
unbind = SUPER SHIFT, Y
bindd = SUPER SHIFT, Y, YouTube, exec, firefox "https://youtube.com/"

# Replace 1Password with KeePassXC (Super+Shift+K instead of Super+Shift+/)
unbind = SUPER SHIFT, SLASH
bindd = SUPER SHIFT, K, KeePassXC, exec, uwsm-app -- keepassxc

# Enable natural scrolling for touchpad
input {
  touchpad {
    natural_scroll = true
  }
}
